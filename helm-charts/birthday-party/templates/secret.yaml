{{- if not .Values.secrets.existingSecret }}
{{- $name := include "bp.secretName" . }}
{{- /* Reuse values from a previous install so passwords don't change on upgrade */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "bp.labels" . | nindent 4 }}
  annotations:
    # Keep the passwords if the release is uninstalled, since the data volumes are kept too
    helm.sh/resource-policy: keep
type: Opaque
data:
  postgres-password: {{ coalesce .Values.secrets.postgresPassword (get $existing "postgres-password" | b64dec) (randAlphaNum 24) | b64enc }}
  s3-access-key: {{ coalesce .Values.secrets.s3AccessKey (get $existing "s3-access-key" | b64dec) (randAlphaNum 16) | b64enc }}
  s3-secret-key: {{ coalesce .Values.secrets.s3SecretKey (get $existing "s3-secret-key" | b64dec) (randAlphaNum 32) | b64enc }}
  admin-token: {{ coalesce .Values.secrets.adminToken (get $existing "admin-token" | b64dec) (randAlphaNum 20) | b64enc }}
{{- end }}
