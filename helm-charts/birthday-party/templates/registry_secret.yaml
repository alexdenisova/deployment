---
apiVersion: v1                                                                                                       
kind: Secret                                                                                                         
metadata:                                                                                                            
  name: {{ .Values.registrySecret.name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
type: kubernetes.io/dockerconfigjson
data:                                                                                                                
  .dockerconfigjson: {{ .Values.registrySecret.data | b64enc }}
